name: Docker CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  docker-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create CI secret files
        run: |
          mkdir -p secrets
          printf '%s\n' 'ci_admin' > secrets/mongo_username.txt
          printf '%s\n' 'ci_password' > secrets/mongo_password.txt
          printf '%s\n' 'mongodb://ci_admin:ci_password@mongodb:27017/taskflow?authSource=admin' > secrets/mongodb_uri.txt
          printf '%s\n' 'ci_redis_password' > secrets/redis_password.txt
          printf '%s\n' 'redis://:ci_redis_password@redis:6379' > secrets/redis_url.txt

      - name: Validate Docker Compose
        run: docker compose --profile dev config -q

      - name: Build backend image
        run: docker build -t taskflow-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t taskflow-frontend:ci ./frontend

      - name: Build worker image
        run: docker build -t taskflow-worker:ci ./worker

      - name: Scan backend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: taskflow-backend:ci
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: taskflow-frontend:ci
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH

      - name: Scan worker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: taskflow-worker:ci
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH

      - name: Start TaskFlow stack
        run: docker compose --profile dev up -d

      - name: Wait for TaskFlow backend
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8080/api/health; then
              echo "TaskFlow backend is healthy"
              exit 0
            fi

            echo "Waiting for TaskFlow backend..."
            sleep 2
          done

          docker compose --profile dev ps
          docker compose --profile dev logs
          exit 1

      - name: Test background job processing
        run: |
          curl -fsS -X POST http://localhost:8080/api/jobs

          for i in {1..15}; do
            if docker compose logs worker 2>&1 | grep -q "Job completed:"; then
              echo "Background job processed successfully"
              exit 0
            fi

            echo "Waiting for background job..."
            sleep 2
          done

          docker compose logs worker --tail=50
          exit 1

      - name: Stop TaskFlow stack
        if: always()
        run: docker compose --profile dev down