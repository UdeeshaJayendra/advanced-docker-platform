services:

  frontend:
    build:
      context: ./frontend
    container_name: taskflow-frontend
    ports:
      - "8080:80"
    networks:
      - public
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 128m
    cpus: "0.25"

  backend:
    build:
      context: ./backend
    container_name: taskflow-backend
    environment:
      PORT: 3000
      MONGODB_URI_FILE: /run/secrets/mongodb_uri
      REDIS_URL_FILE: /run/secrets/redis_url
    secrets:
      - mongodb_uri
      - redis_url
    networks:
      - public
      - internal
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 512m
    cpus: "0.50"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mongodb:
    image: mongo:8
    container_name: taskflow-mongodb
    command:
      - mongod
      - --auth
      - --bind_ip_all
    environment:
      MONGO_INITDB_ROOT_USERNAME_FILE: /run/secrets/mongo_username
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_password
    volumes:
      - mongodb_data:/data/db
    networks:
      - internal
    secrets:
      - mongo_username
      - mongo_password
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: "0.50"

  redis:
    image: redis:8-alpine
    container_name: taskflow-redis
    command:
      - sh
      - -c
      - redis-server --appendonly yes --requirepass "$$(cat /run/secrets/redis_password)"
    volumes:
      - redis_data:/data
    networks:
      - internal
    secrets:
      - redis_password
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-c",
          "redis-cli -a \"$$(cat /run/secrets/redis_password)\" ping | grep PONG"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: "0.25"

  worker:
    build:
      context: ./worker
    container_name: taskflow-worker
    environment:
      REDIS_URL_FILE: /run/secrets/redis_url
    secrets:
      - redis_url
    networks:
      - internal
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 256m
    cpus: "0.25"
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  mongodb_data:
  redis_data:

networks:
  public:
    name: taskflow-public

  internal:
    name: taskflow-internal
    internal: true

secrets:
  mongo_username:
    file: ./secrets/mongo_username.txt

  mongo_password:
    file: ./secrets/mongo_password.txt

  mongodb_uri:
    file: ./secrets/mongodb_uri.txt

  redis_password:
    file: ./secrets/redis_password.txt

  redis_url:
    file: ./secrets/redis_url.txt